name: Build QUESTION BANK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name question_bank .

      - name: Put app code in the correct folder
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: QUESTION-BANK-APK
          path: build/app/outputs/flutter-apk/app-release.apk
